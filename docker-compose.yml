name: media-stack

# Stack de medios auto-hospedado con acceso externo via subpaths.
# Reverse proxy: Caddy con Caddyfile estático (./caddy/Caddyfile).
# Acceso: http://<IP-O-DOMINIO>/{jellyfin,sonarr,radarr,bazarr,prowlarr,jellyseerr,wizarr}
#
# TODO lo que puede configurarse solo, se configura solo con:
#   bash scripts/bootstrap.sh
# Ver README.md → Inicio rápido.
#
# ─── Paths y credenciales ──────────────────────────────────────────────────────
# Todo lo variable vive en `.env` (copiá `.env.example`). Nada de esto necesita
# editarse en este archivo: PUID/PGID/TZ, credenciales de qBittorrent y Jellyfin,
# lista de indexers a auto-agregar en Prowlarr, etc.
#
# ─── Data layout (TRaSH Guides) ────────────────────────────────────────────────
# La estructura interna sigue la convención de TRaSH Guides para que los *arr
# puedan usar hardlinks y moves atómicos entre /data/torrents y /data/media.
# Ver docs/DATA_LAYOUT.md o https://trash-guides.info/File-and-Folder-Structure/How-to-set-up/Docker/

x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-America/Argentina/Mendoza}

services:
  # === Reverse proxy (Caddy con Caddyfile estático) ===
  caddy:
    image: caddy:2.10-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Si DOMAIN está vacío en .env, Caddy escucha en :80 plano (sin ACME).
      # Si tiene un dominio real, Caddy pide el cert de Let's Encrypt solo.
      SITE_ADDRESS: ${DOMAIN:-80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      # Caddyfile vive en el repo (./caddy/) — no se ignora por .gitignore,
      # así un clon fresco tiene el archivo disponible para el bind mount.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - proxy

  # === Indexer manager (Prowlarr) ===
  # Reemplaza a Jackett: Prowlarr sincroniza indexers automáticamente hacia
  # Sonarr/Radarr por API ("Apps"), sin copiar/pegar Torznab feeds a mano.
  # Sí soporta UrlBase, así que va detrás de Caddy en /prowlarr.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_DIR:-./config}/prowlarr:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9696/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - proxy

  # === FlareSolverr (resuelve challenges de Cloudflare para indexers) ===
  # Se expone directo en :8191 del host, sin pasar por Caddy (no tiene subpath
  # y solo lo consume Prowlarr internamente vía la red Docker).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-America/Argentina/Mendoza}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8191/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - proxy

  # === TV shows ===
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_DIR:-./config}/sonarr:/config
      # TRaSH layout: Sonarr ve /data entero para que los hardlinks funcionen
      # y los moves desde /data/torrents a /data/media sean atómicos.
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8989/ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - proxy

  # === Movies ===
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_DIR:-./config}/radarr:/config
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7878/ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - proxy

  # === Subtitles ===
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_DIR:-./config}/bazarr:/config
      # Bazarr solo necesita ver la biblioteca final.
      - ${DATA_DIR:-./data}/media:/data/media
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6767/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    networks:
      - proxy

  # === Downloads ===
  # qBittorrent se expone DIRECTO en :8080 del host, sin pasar por Caddy.
  # No soporta subpath de forma estable (las URLs internas del HTML son relativas
  # y rompen cuando Caddy strippea el prefijo). Es la práctica estándar.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ${CONFIG_DIR:-./config}/qbittorrent:/config
      # qBittorrent solo escribe en /data/torrents. Los *arr mueven los archivos
      # terminados a /data/media vía hardlink + delete del original.
      - ${DATA_DIR:-./data}/torrents:/data/torrents
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - proxy

  # === Media server ===
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      <<: *common-env
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHED_URL:-http://localhost:8096}
    volumes:
      - ${CONFIG_DIR:-./config}/jellyfin:/config
      # Jellyfin solo escanea la biblioteca final.
      - ${DATA_DIR:-./data}/media:/data/media
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8096/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - proxy

  # === Request management ===
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Argentina/Mendoza}
      LOG_LEVEL: info
    volumes:
      - ${CONFIG_DIR:-./config}/jellyseerr:/app/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5055/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    depends_on:
      jellyfin:
        condition: service_healthy
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    networks:
      - proxy

  # === User invitation system ===
  # Imagen custom de pablokbs con APPLICATION_ROOT funcionando
  # (commits sobre wizarr upstream en junio 2026).
  wizarr:
    image: docker.io/pablokbs/wizarr
    container_name: wizarr
    restart: unless-stopped
    environment:
      <<: *common-env
      APPLICATION_ROOT: /wizarr
    volumes:
      - ${CONFIG_DIR:-./config}/wizarr:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5690/wizarr"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    depends_on:
      jellyfin:
        condition: service_healthy
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
